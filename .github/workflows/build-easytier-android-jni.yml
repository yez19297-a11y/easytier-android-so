name: build-easytier-android-jni

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up some disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Checkout EasyTier (shallow)
        run: git clone --depth 1 https://github.com/EasyTier/EasyTier.git src

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          packages: 'build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android

      - name: Show toolchain versions
        working-directory: src
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version
          rustup target list --installed

      - name: Install protoc (protobuf-compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Cross-compile the JNI library
        working-directory: src
        run: |
          set -euo pipefail
          export NDK="$ANDROID_HOME/ndk/26.0.10792818"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          cargo build --release -p easytier-android-jni --target aarch64-linux-android

      - name: Strip the library
        working-directory: src
        run: |
          STRIP="$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" target/aarch64-linux-android/release/libeasytier_android_jni.so || true
          ls -lh target/aarch64-linux-android/release/libeasytier_android_jni.so

      - name: Check the JNI symbols we depend on
        working-directory: src
        run: |
          NM="$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only target/aarch64-linux-android/release/libeasytier_android_jni.so \
            | grep -E "Java_com_easytier_jni_EasyTierJNI_(runNetworkInstance|setTunFd|parseConfig)" || \
            (echo "JNI symbols not found - the Java class/package names must match exactly" && exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: libeasytier_android_jni-arm64-v8a
          path: src/target/aarch64-linux-android/release/libeasytier_android_jni.so
          if-no-files-found: error